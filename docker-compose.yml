services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile

    image: dsa-mentor-worker:local
    container_name: dsa-mentor-worker

    env_file:
      - .env

    ports:
      - "127.0.0.1:${WORKER_PORT:-6000}:6000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:6000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s